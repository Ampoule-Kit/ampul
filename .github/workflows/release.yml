name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from package.json
        id: read
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-26.04-arm
          - target: macos-x64
            runner: macos-26-intel
          - target: macos-arm64
            runner: macos-latest
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check the binary runs and reports the right version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          extension=""
          if [ "$RUNNER_OS" = "Windows" ]; then extension=".exe"; fi
          reported=$("dist/ampul$extension" --version)
          echo "$reported"
          [ "$reported" = "ampul $VERSION" ] || { echo "::error::Expected 'ampul $VERSION', got '$reported'"; exit 1; }

      - name: Package the binary for its platform
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release
          archive="ampul-$VERSION-$TARGET"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip -mx=9 "release/$archive.zip" ./dist/ampul.exe > /dev/null
          elif [ "$RUNNER_OS" = "macOS" ]; then
            tar --options xz:compression-level=9 -C dist -cJf "release/$archive.tar.xz" ampul
          else
            XZ_OPT=-9 tar -C dist -cJf "release/$archive.tar.xz" ampul
          fi
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: ampul-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: ampul-*
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: sha256sum ampul-* > SHA256SUMS.txt

      - name: Create or replace the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists: moving its tag to $GITHUB_SHA and replacing its binaries."
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null \
              || echo "::warning::Could not move tag $TAG to $GITHUB_SHA; replacing the binaries anyway."
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ampul $TAG" \
              --generate-notes
          fi
